name: Provision Azure Infrastructure

on:
  workflow_dispatch:
    inputs:
      resource_group:
        description: 'Resource group name'
        required: true
        default: 'pihole-dynatrace-rg'
      location:
        description: 'Azure region (e.g., eastus, westus2)'
        required: true
        default: 'eastus'
      vm_pihole_name:
        description: 'Pi-hole VM name'
        required: false
        default: 'pihole-vm'
      vm_dynatrace_name:
        description: 'Dynatrace VM name'
        required: false
        default: 'dynatrace-vm'
      username:
        description: 'VM admin username'
        required: true
        default: 'azureuser'

jobs:
  provision-vms:
    runs-on: ubuntu-latest
    env:
      SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Display configuration
        run: |
          echo "Resource Group: ${{ github.event.inputs.resource_group }}"
          echo "Location: ${{ github.event.inputs.location }}"
          echo "Pi-hole VM: ${{ github.event.inputs.vm_pihole_name }}"
          echo "Dynatrace VM: ${{ github.event.inputs.vm_dynatrace_name }}"
          echo "Username: ${{ github.event.inputs.username }}"

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Provision infrastructure
        shell: pwsh
        run: |
          ./Invoke-AzureProvisioning.ps1 `
            -ResourceGroupName '${{ github.event.inputs.resource_group }}' `
            -Location '${{ github.event.inputs.location }}' `
            -Username '${{ github.event.inputs.username }}' `
            -SshKeyContent "$env:SSH_PUBLIC_KEY"

      - name: Verify resources created
        shell: pwsh
        run: |
          Write-Host "Verifying Azure resources..."
          az group show --name '${{ github.event.inputs.resource_group }}' --query 'id' --output tsv

  cleanup:
    needs: provision-vms
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Notify status
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "Provisioning completed successfully!"
          else
            echo "Provisioning encountered an error. Resources may need manual cleanup."
          fi
