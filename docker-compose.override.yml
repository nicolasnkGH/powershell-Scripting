# Docker Compose Override File - Local Development Only
# =====================================================
# This file is automatically loaded by docker-compose in development mode.
# For production, use docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  # ============================================================================
  # Port mappings for local development access
  # DO NOT use this file in production on a VPN server with direct LAN access!
  # ============================================================================

  radarr:
    ports:
      - "7878:7878"
    networks:
      - frontend

  sonarr:
    ports:
      - "8989:8989"
    networks:
      - frontend

  lidarr:
    ports:
      - "8686:8686"
    networks:
      - frontend

  bazarr:
    ports:
      - "6767:6767"
    networks:
      - frontend

  jackett:
    ports:
      - "9117:9117"
    networks:
      - frontend

  overseerr:
    ports:
      - "5055:5055"
    networks:
      - frontend

  tautulli:
    ports:
      - "8181:8181"
    networks:
      - frontend

  throwtorrent:
    ports:
      - "8090:8090"
    networks:
      - frontend

  keeptorrent:
    ports:
      - "8085:8085"
    networks:
      - frontend

  flaresolverr:
    ports:
      - "8191:8191"
    networks:
      - frontend

  slskd:
    ports:
      - "5030:5030"   # HTTP Web UI
      - "5031:5031"   # HTTPS Web UI (optional)
      - "50300:50300" # P2P TCP
    networks:
      - frontend

# Custom network for LAN access to web interfaces (only in development)
networks:
  frontend:
    driver: bridge
